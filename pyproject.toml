[project]
name = "code-flywheel"
version = "0.1.0"
description = "代码飞轮 — 日志智能分析平台"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.21",
  "tree-sitter-languages>=1.10",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "mcp>=0.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4"]
api = [
  "uvicorn[standard]>=0.27,<0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]