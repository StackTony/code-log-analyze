llm:
  api_key: ${CODEFLY_LLM_API_KEY}
  model_name: gpt-4
  endpoint: https://api.openai.com/v1
  timeout_seconds: 30
  max_retries: 3
  batch_size: 20
storage:
  postgres_dsn: ${CODEFLY_PG_DSN}
  redis_port: 6398
  redis_namespace: codefly-m1
extraction:
  top_n_candidates: 50
  include_print: false
  ingest_timeout_minutes: 30
  candidate_ttl_days: 30
  extractor_version: "1.0.0"
sanitizer:
  enabled: true
  patterns: [api_key, password, token, ipv4, ipv6, email]
  replacement: "[REDACTED_{kind}]"
metrics:
  enabled: true
  endpoint: /metrics
  port: 9464  # 避开 CatCafe runtime 9100/3003/3004（家规铁律：外部项目禁占自留地）
api:
  host: "127.0.0.1"
  port: 8000  # 避开 CatCafe runtime 3003/3004（家规铁律方向修正）
  enable_auth: false  # F001.1 dev-only
  cors_origins: ["http://localhost:3003"]  # 允许 CatCafe 前端跨域访问（不占用 3003）